# MundoFlag on an Oracle Cloud VM.
# Only Caddy is reachable from the internet (ports 80/443); the app's port 8080 stays
# inside the private Docker network, so the only way in is through the web pages.
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    read_only: true          # the container's files can't be changed while it runs
    tmpfs:
      - /tmp                 # the only writable place: SQLite's temp copy of the DB
    environment:
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      # key that decrypts the weekly daily-quiz file, kept only in .env on the server
      - DAILY_QUIZ_KEY=${DAILY_QUIZ_KEY:-}
      # password for the /stats dashboard (STATS_KEY in .env); empty = dashboard off
      - MUNDOFLAG_STATS_KEY=${STATS_KEY:-}
      - MUNDOFLAG_STATS_DIR=/app/stats
    volumes:
      - stats_data:/app/stats   # the anonymous visit/game counters survive restarts and redeploys
    expose:
      - "8080"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  stats_data:
  caddy_data:
  caddy_config:
