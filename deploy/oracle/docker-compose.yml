# MundoFlag on an Oracle Cloud VM.
# Only Caddy is reachable from the internet (ports 80/443); the app's port 8080 stays
# inside the private Docker network, so the only way in is through the web pages.
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    read_only: true          # the container's files can't be changed while it runs
    # no Linux privileges at all, and nothing inside can ever gain more (e.g. via setuid)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g            # a runaway app can't starve the whole VM (Java takes ~60% of this)
    pids_limit: 512
    tmpfs:
      # the only writable place: SQLite's temp copy of the DB, plus the native library
      # sqlite-jdbc unpacks here and loads, so it must allow executing (Docker's default is noexec)
      - /tmp:exec
    environment:
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      # key that decrypts the weekly daily-quiz file, kept only in .env on the server
      - DAILY_QUIZ_KEY=${DAILY_QUIZ_KEY:-}
      # password for the /stats dashboard (STATS_KEY in .env); empty = dashboard off
      - MUNDOFLAG_STATS_KEY=${STATS_KEY:-}
      - MUNDOFLAG_STATS_DIR=/app/stats
      # session cookie: never sent over plain http, not sent by other sites' requests.
      # COOKIE_SECURE=true in .env once the site has HTTPS (a domain); keep false on plain :80
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=${COOKIE_SECURE:-false}
      - SERVER_SERVLET_SESSION_COOKIE_SAME_SITE=lax
    volumes:
      - stats_data:/app/stats   # the anonymous visit/game counters survive restarts and redeploys
    expose:
      - "8080"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    # only the one privilege Caddy needs: listening on ports 80/443
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  stats_data:
  caddy_data:
  caddy_config:
