<!-- MundoFlag app icon: the site's own logo (static/favicon.svg) on a full-bleed square.
     Source for every app / home-screen / store icon - regenerate with tools in mobile-app/README.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd1b7"/>
      <stop offset="1" stop-color="#2a9d8a"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <g id="foreground" transform="translate(512 512) scale(10.5) translate(-32 -32)">
    <!-- globe -->
    <circle cx="32" cy="32" r="28" fill="#ffffff" fill-opacity="0.10"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.6">
      <circle cx="32" cy="32" r="28"/>
      <ellipse cx="32" cy="32" rx="12" ry="28"/>
      <path d="M4 32 H60 M8 18 H56 M8 46 H56"/>
    </g>
    <!-- flag on a pole -->
    <rect x="20" y="14" width="3.6" height="38" rx="1.8" fill="#ffffff"/>
    <path d="M23.4 15.5 C31 12.5 35 19.5 44 16.5 L44 33 C35 36 31 29 23.4 32 Z" fill="#ffffff"/>
  </g>
</svg>
