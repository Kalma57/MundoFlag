<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MundoFlag</title>
<!-- Shown by the app (capacitor.config.json -> server.errorPath) when the game server can't be
     reached - no internet, or the server is down. Everything it needs is inline: it must work offline. -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    box-sizing: border-box; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #e8f9f4, #f9f9f9 60%, #dff5ee);
    color: #2c3e50; -webkit-user-select: none; user-select: none;
  }
  .globe { font-size: 72px; line-height: 1; }
  h1 { margin: 6px 0 0; font-size: 30px; color: #2BB3A3; letter-spacing: 1px; }
  p { margin: 0; max-width: 300px; font-size: 17px; line-height: 1.45; color: #546e7a; }
  button {
    margin-top: 10px; min-width: 180px; min-height: 50px; padding: 0 28px; border: 0; border-radius: 26px;
    background: #2BB3A3; color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.5px;
    box-shadow: 0 6px 18px rgba(43, 179, 163, 0.35);
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="globe">🌍</div>
  <h1>MUNDOFLAG</h1>
  <p>We can't reach the game right now. Check your internet connection and try again.</p>
  <button type="button" id="retry">Try again</button>
  <script>
    // Must match server.url in capacitor.config.json
    var SITE = 'https://mundoflag.onrender.com/';
    function retry() { window.location.href = SITE; }
    document.getElementById('retry').addEventListener('click', retry);
    // Come back on its own as soon as the phone is online again
    window.addEventListener('online', retry);
  </script>
</body>
</html>
