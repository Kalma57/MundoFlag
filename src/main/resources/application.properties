spring.application.name=flagdemo

spring.datasource.url=jdbc:sqlite::resource:data/MundoFlag.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite dialect from hibernate-community-dialects
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

spring.web.resources.cache.period=86400
spring.web.resources.chain.cache=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,application/octet-stream
server.compression.min-response-size=1024
# Behind Render / Cloudflare: trust X-Forwarded-* so generated absolute links keep https and the public host
server.forward-headers-strategy=framework
# Keep a game for 2 hours without activity (default is 30 minutes) - on a phone it's common to
# switch apps mid-game and come back later, and an expired session means the game is gone.
server.servlet.session.timeout=2h
# Keep the session id in the cookie only, never appended to links as ";jsessionid=..."
server.servlet.session.tracking-modes=cookie
