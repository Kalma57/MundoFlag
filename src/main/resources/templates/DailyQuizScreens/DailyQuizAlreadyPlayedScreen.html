<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free geography games: guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Play solo, against the computer, or 1v1 with a friend.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MundoFlag">
    <meta property="og:title" content="MundoFlag - geography games">
    <meta property="og:description" content="Guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Solo, vs the computer, or 1v1 with a friend.">
    <meta property="og:image" th:if="${siteUrl}" th:content="${siteUrl} + '/img/og-image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>Daily Quiz: Already Played</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --orange: #e67e22;
            --orange-dark: #cf6c15;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        h1, h2 { font-family: 'Baloo 2', 'Nunito', sans-serif; }

        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px 80px; text-align: center;
            background: linear-gradient(-45deg, #fff4e0, #f9f9f9, #ffe9cc, #fff8ee);
            background-size: 400% 400%; animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .top-actions { position: fixed; top: 24px; left: 24px; z-index: 5; }
        .home-btn {
            padding: 12px 26px; font-size: 17px; font-weight: 800; border-radius: 999px; cursor: pointer;
            border: 2px solid var(--orange); background: white; color: var(--orange-dark); box-shadow: var(--shadow-sm);
            text-decoration: none; display: inline-block; transition: 0.3s;
        }
        .home-btn:hover { background: #fff4e0; transform: translateY(-2px); box-shadow: var(--shadow-md); }

        h1 { font-size: 40px; color: var(--orange); text-shadow: 0 6px 16px rgba(230,126,34,0.3); margin: 20px 0 10px; }
        .subtitle { font-size: 18px; color: #555; max-width: 460px; margin-bottom: 34px; }

        .country-header { display: flex; align-items: center; gap: 26px; margin-bottom: 28px; }
        .country-flag { width: 135px; height: 96px; object-fit: cover; border-radius: 12px; box-shadow: var(--shadow-md); border: 3px solid rgba(230,126,34,0.25); flex-shrink: 0; }
        .country-name { font-size: 38px; font-weight: 800; color: #2c2c2c; text-align: left; }
        .country-capital { font-size: 24px; color: #666; margin-top: 6px; text-align: left; }

        .years-ago {
            display: inline-block; background: linear-gradient(135deg, var(--orange), var(--orange-dark)); color: #fff;
            font-size: 20px; font-weight: 800; letter-spacing: 0.5px; padding: 9px 22px; border-radius: 999px;
            margin-bottom: 22px; box-shadow: var(--shadow-md);
        }
        .years-ago[hidden] { display: none; }

        .info-card {
            width: 100%; max-width: 720px; background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
            border-radius: 22px; box-shadow: var(--shadow-md); padding: 34px 40px; margin: 0 20px 30px;
        }
        .info-card h2 { color: var(--orange-dark); font-size: 28px; margin-bottom: 18px; }
        .info-card p { font-size: 21px; line-height: 1.7; color: #333; }

        .come-back { font-size: 19px; color: #888; font-weight: 700; }
    </style>
    <link rel="stylesheet" href="/css/mobile.css?v=3">
</head>

<body>

<div class="top-actions">
    <a class="home-btn" href="/">← Back to home</a>
</div>

<h1>You've already played today</h1>
<p class="subtitle">Here's what today's Daily Quiz was about. A new country will be waiting after midnight.</p>

<div class="country-header" id="countryHeader" th:if="${countryName}" hidden>
    <img class="country-flag" id="countryFlag" alt="Country flag">
    <div>
        <div class="country-name" th:text="${countryName}">Country</div>
        <div class="country-capital" th:text="${countryCapital}">Capital</div>
    </div>
</div>

<div class="years-ago" th:if="${yearsAgo}" th:text="${yearsAgo} + (${yearsAgo} == 1 ? ' YEAR AGO TODAY' : ' YEARS AGO TODAY')">5 YEARS AGO TODAY</div>

<div class="info-card" th:if="${eventTitle}">
    <h2 th:text="${eventTitle}">Today's Pick</h2>
    <p th:text="${infoText}">Info text.</p>
</div>

<div class="come-back">Come back tomorrow for a new country.</div>

<script th:if="${countryName}" th:inline="javascript">
    // FlagPath from the DB is a raw filesystem-style path (e.g. /static/DB/FlagsImages/usa.png),
    // not a browser URL - every screen in this app strips it to just the filename and rebuilds
    // the real served path from that, same as here.
    const rawFlagPath = /*[[${countryFlagPath}]]*/ '';
    let fileName = rawFlagPath;
    if (fileName.includes('/') || fileName.includes('\\')) fileName = fileName.split(/[/\\]/).pop();
    document.getElementById('countryFlag').src = `/DB/FlagsImages/${fileName}`;
    document.getElementById('countryHeader').hidden = false;
</script>

<script src="/js/bg-music.js?v=2"></script>
</body>
</html>
