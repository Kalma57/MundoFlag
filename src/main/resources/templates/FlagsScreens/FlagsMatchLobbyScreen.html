<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free geography games: guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Play solo, against the computer, or 1v1 with a friend.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MundoFlag">
    <meta property="og:title" content="MundoFlag - geography games">
    <meta property="og:description" content="Guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Solo, vs the computer, or 1v1 with a friend.">
    <meta property="og:image" th:if="${siteUrl}" th:content="${siteUrl} + '/img/og-image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>Flags - 1v1 vs Computer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1, h2, .section-title { font-family: 'Baloo 2', 'Nunito', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 60px 20px;
            background: linear-gradient(-45deg, #e8f7ee, #f9f9f9, #e1f5e6, #f0fff3);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: #4CAF50;
            opacity: 0.15;
            filter: blur(120px);
            border-radius: 50%;
            animation: float 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .glow1 { top: 5%; left: 10%; }
        .glow2 { bottom: 5%; right: 10%; }

        @keyframes float {
            from { transform: translateY(0px); }
            to   { transform: translateY(-60px); }
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 21px;
            font-weight: bold;
            color: #4CAF50;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(255,255,255,0.85);
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .back-link:hover { transform: translateX(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }

        .lobby-header { position: relative; z-index: 1; text-align: center; margin-bottom: 10px; }

        h1 {
            font-size: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            color: #4CAF50;
            text-shadow: 0 8px 20px rgba(76,175,80,0.35);
        }

        .lobby-subtitle { font-size: 23px; color: #4a4a4a; margin-top: 10px; }

        .lobby-form {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 34px;
            width: 100%;
            max-width: 760px;
            margin-top: 20px;
        }

        .section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .section-title {
            font-size: 26px;
            color: #2c2c2c;
            letter-spacing: 0.5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            width: 100%;
        }

        /* Hide the actual radio input; style the label as the clickable card */
        .option-card input { display: none; }

        .option-card label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            border: 2px solid transparent;
            box-shadow: 0 10px 24px rgba(0,0,0,0.1);
            transition: 0.25s;
        }

        .option-card label:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.16); }

        .option-card input:checked + label {
            border-color: var(--accent, #4CAF50);
            box-shadow: 0 0 0 4px rgba(76,175,80,0.15), 0 14px 30px rgba(0,0,0,0.16);
        }

        .option-icon { font-size: 32px; }
        .option-title { font-size: 22px; font-weight: 800; color: #2c2c2c; }
        .option-desc { font-size: 21px; color: #666; }

        .option-card.easy label { --accent: #42a5f5; }
        .option-card.medium label { --accent: #ffa726; }
        .option-card.hard label { --accent: #ef5350; }

        .start-btn {
            margin-top: 6px;
            padding: 16px 48px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            background: linear-gradient(135deg, #4CAF50, #3f9142);
            box-shadow: 0 10px 24px rgba(0,0,0,0.25);
            transition: 0.3s;
        }

        .start-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 28px rgba(0,0,0,0.35); }
    </style>
    <link rel="stylesheet" href="/css/mobile.css?v=3">
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<a class="back-link" href="/Flags/match">← Back</a>

<div class="lobby-header">
    <h1><span>⚔️</span> 1v1 vs Computer</h1>
    <p class="lobby-subtitle">
        Step 2 of 2 -
        <strong th:text="'BEST OF ' + ${bestOf}">BEST OF 3</strong>
        - first to <span th:text="${pointsToWin}">2</span> correct flags wins
    </p>
</div>

<form class="lobby-form" action="/Flags/match/start" method="get">

    <input type="hidden" name="bestOf" th:value="${bestOf}">

    <div class="section">
        <div class="section-title">🖼️ Flag Reveal Mode</div>
        <div class="options-grid">
            <div class="option-card easy">
                <input type="radio" name="difficulty" id="diff-easy" value="EASY" checked>
                <label for="diff-easy">
                    <span class="option-icon">🟢</span>
                    <span class="option-title">EASY</span>
                    <span class="option-desc">Matches stay revealed in true color as you guess</span>
                </label>
            </div>
            <div class="option-card hard">
                <input type="radio" name="difficulty" id="diff-hard" value="HARD">
                <label for="diff-hard">
                    <span class="option-icon">🔴</span>
                    <span class="option-title">HARD</span>
                    <span class="option-desc">Only matches are marked green, nothing else revealed</span>
                </label>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🤖 Opponent Skill</div>
        <div class="options-grid">
            <div class="option-card easy">
                <input type="radio" name="aiLevel" id="ai-easy" value="EASY">
                <label for="ai-easy">
                    <span class="option-icon">🐢</span>
                    <span class="option-title">EASY</span>
                    <span class="option-desc">Slow and unsure of itself</span>
                </label>
            </div>
            <div class="option-card medium">
                <input type="radio" name="aiLevel" id="ai-medium" value="MEDIUM" checked>
                <label for="ai-medium">
                    <span class="option-icon">🙂</span>
                    <span class="option-title">MEDIUM</span>
                    <span class="option-desc">A fair, balanced opponent</span>
                </label>
            </div>
            <div class="option-card hard">
                <input type="radio" name="aiLevel" id="ai-hard" value="HARD">
                <label for="ai-hard">
                    <span class="option-icon">🔥</span>
                    <span class="option-title">HARD</span>
                    <span class="option-desc">Fast and sharp - good luck!</span>
                </label>
            </div>
        </div>
    </div>

    <button type="submit" class="start-btn">START MATCH</button>

</form>

<script src="/js/bg-music.js?v=2"></script>
</body>
</html>
