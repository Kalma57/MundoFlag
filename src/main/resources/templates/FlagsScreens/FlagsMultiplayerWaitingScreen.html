<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free geography games: guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Play solo, against the computer, or 1v1 with a friend.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MundoFlag">
    <meta property="og:title" content="MundoFlag - geography games">
    <meta property="og:description" content="Guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Solo, vs the computer, or 1v1 with a friend.">
    <meta property="og:image" th:if="${siteUrl}" th:content="${siteUrl} + '/img/og-image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>Flags - Waiting for Opponent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1, h2 { font-family: 'Baloo 2', 'Nunito', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 60px 20px;
            background: linear-gradient(-45deg, #e8f7ee, #f9f9f9, #e1f5e6, #f0fff3);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            background: #4CAF50;
            opacity: 0.15;
            filter: blur(120px);
            border-radius: 50%;
            animation: float 8s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .glow1 { top: 5%; left: 10%; }
        .glow2 { bottom: 5%; right: 10%; }

        @keyframes float {
            from { transform: translateY(0px); }
            to   { transform: translateY(-60px); }
        }

        .back-link {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 21px;
            font-weight: bold;
            color: #4CAF50;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(255,255,255,0.85);
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
            transition: 0.3s;
        }

        .back-link:hover { transform: translateX(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }

        .waiting-header { position: relative; z-index: 1; text-align: center; margin-bottom: 10px; }

        h1 {
            font-size: 54px;
            color: #4CAF50;
            text-shadow: 0 8px 20px rgba(76,175,80,0.35);
        }

        .waiting-sub { font-size: 21px; color: #4a4a4a; margin-top: 10px; }

        .waiting-panel {
            position: relative;
            z-index: 1;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            padding: 44px 50px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: 26px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.15);
        }

        .room-code-label { font-size: 16px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        .room-code-display {
            font-family: 'Consolas', monospace;
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 14px;
            color: #4CAF50;
            padding: 10px 30px;
            background: #f2fbf3;
            border-radius: 18px;
            border: 3px dashed #4CAF50;
        }

        .copy-btn {
            padding: 10px 26px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 999px;
            border: 2px solid #4CAF50;
            background: white;
            color: #4CAF50;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover { background: #e8f7ee; transform: translateY(-2px); }
        .copy-btn.copied { background: #4CAF50; color: white; }

        .spinner {
            width: 34px;
            height: 34px;
            border: 5px solid #e0e0e0;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .waiting-status { font-size: 17px; font-weight: 700; color: #4a4a4a; }
    </style>
    <link rel="stylesheet" href="/css/mobile.css?v=3">
</head>

<body th:attr="data-room-code=${roomCode},data-player-token=${playerToken}">

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<a class="back-link" href="/Flags">← Flags</a>

<div class="waiting-header">
    <h1>⏳ Waiting for Opponent</h1>
    <p class="waiting-sub">Share this room code with your friend so they can join</p>
</div>

<div class="waiting-panel">
    <div class="room-code-label">Room Code</div>
    <div class="room-code-display" id="roomCodeDisplay" th:text="${roomCode}">ABC123</div>
    <button class="copy-btn" id="copyBtn">📋 COPY CODE</button>
    <div class="spinner"></div>
    <div class="waiting-status">Waiting for your friend to join...</div>
</div>

<script th:inline="none">
    const ROOM_CODE    = document.body.getAttribute('data-room-code');
    const PLAYER_TOKEN = document.body.getAttribute('data-player-token');

    const copyBtn = document.getElementById('copyBtn');

    copyBtn.addEventListener('click', async function () {
        try {
            await navigator.clipboard.writeText(ROOM_CODE);
            copyBtn.textContent = '✅ COPIED!';
            copyBtn.classList.add('copied');
            setTimeout(function () {
                copyBtn.textContent = '📋 COPY CODE';
                copyBtn.classList.remove('copied');
            }, 1800);
        } catch (e) {
            console.error('Copy failed:', e);
        }
    });

    async function pollStatus() {
        try {
            const response = await fetch('/Flags/match/pvp/status/ajax?roomCode=' + encodeURIComponent(ROOM_CODE) + '&playerToken=' + encodeURIComponent(PLAYER_TOKEN));
            const data = await response.json();
            if (data.roomStatus === 'IN_PROGRESS' || data.roomStatus === 'FINISHED') {
                window.location.href = '/Flags/match/pvp/room?roomCode=' + encodeURIComponent(ROOM_CODE);
            } else if (data.roomStatus === 'NOT_FOUND') {
                clearInterval(pollTimer);
            }
        } catch (err) {
            console.error('Status poll error:', err);
        }
    }

    const pollTimer = setInterval(pollStatus, 1500);
    pollStatus();
</script>

<script src="/js/bg-music.js?v=2"></script>
</body>
</html>
