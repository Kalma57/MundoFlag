<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Free geography games: guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Play solo, against the computer, or 1v1 with a friend.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MundoFlag">
    <meta property="og:title" content="MundoFlag - geography games">
    <meta property="og:description" content="Guess countries by their flags, find them on a 3D globe, match capital cities, and take a new daily quiz. Solo, vs the computer, or 1v1 with a friend.">
    <meta property="og:image" th:if="${siteUrl}" th:content="${siteUrl} + '/img/og-image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <title>MundoFlag</title>

    <!-- Same import map as the globe screens, so /js/preload-globe.js can warm their modules -->
    <script type="importmap">
        { "imports": {
            "three": "/three/three.module.js?v=2",
            "three/": "/three/",
            "three-globe": "https://esm.sh/three-globe@2.41.11?external=three,three-conic-polygon-geometry&bundle",
            "three-conic-polygon-geometry": "/js/conic-polygon-geometry-cache.js?v=1"
        } }
    </script>

    <!-- Custom font pairing: Baloo 2 for bold display titles, Nunito for everything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* Reset default browser styles */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1, h2, .game-title{
            font-family:'Baloo 2', 'Nunito', sans-serif;
        }

        /* Full screen animated gradient background */
        body{

            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:10px;
            padding:60px 20px;

            background: linear-gradient(-45deg,#e9f8f5,#f9f9f9,#dff6f1,#e6fffb);
            background-size:400% 400%;

            animation: gradientMove 12s ease infinite;

            overflow-x:hidden;
        }

        /* Gradient animation */
        @keyframes gradientMove{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }

        }

        /* Decorative floating glow circles — fixed so they stay put even if the page scrolls */
        .glow-circle{

            position:fixed;
            width:400px;
            height:400px;

            background:#3fc1aa;

            opacity:0.15;

            filter:blur(120px);

            border-radius:50%;

            animation: float 10s infinite alternate ease-in-out;

            pointer-events:none;

        }

        .glow2{
            top:10%;
            left:5%;
        }

        .glow3{
            bottom:10%;
            right:10%;
        }

        /* Floating animation */
        @keyframes float{

            from{
                transform:translateY(0px);
            }

            to{
                transform:translateY(-60px);
            }

        }

        /* Page header — sits above the hub container, not inside the glass panel */
        .hub-header{

            position:relative;
            z-index:1;

            text-align:center;

            margin-bottom:10px;

        }

        /* Title styling */
        h1{

            font-size:108px;

            letter-spacing:4px;

            color:#3fc1aa;

            text-shadow:
                0 10px 25px rgba(63,193,170,0.35);

            animation:titleGlow 3s infinite alternate;

        }

        /* Subtle glowing title animation */
        @keyframes titleGlow{

            from{
                text-shadow:0 5px 15px rgba(63,193,170,0.3);
            }

            to{
                text-shadow:0 10px 40px rgba(63,193,170,0.7);
            }

        }

        /* Small explanatory line under the hub title */
        .hub-subtitle{

            font-size:25px;

            color:#4a6b66;

            margin-top:10px;

            letter-spacing:1px;

        }

        /* Grid holding every game card — auto-wraps, so adding a new game later
           is just adding another .game-card element, no layout changes needed */
        .games-grid{

            position:relative;
            z-index:1;

            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
            gap:30px;

            width:100%;
            max-width:1040px;

            margin-top:20px;

        }

        /* One card per game — the whole card is a single, unambiguous entry
           point ("go play this game"). Difficulty/mode selection lives one
           click deeper, on that game's own lobby page. */
        .game-card{

            position:relative;

            display:flex;
            flex-direction:column;
            align-items:center;
            text-align:center;
            gap:14px;

            padding:40px 30px 32px;

            text-decoration:none;

            background:rgba(255,255,255,0.8);

            backdrop-filter:blur(12px);

            border-radius:24px;

            border:2px solid transparent;

            box-shadow:0 15px 35px rgba(0,0,0,0.12);

            transition:all 0.35s ease;

            animation:fadeIn 1s ease;

        }

        @keyframes fadeIn{

            from{
                transform:translateY(30px);
                opacity:0;
            }

            to{
                transform:translateY(0);
                opacity:1;
            }

        }

        .game-card:hover{

            transform:translateY(-8px) scale(1.03);

            border-color:var(--accent);

            box-shadow:0 22px 45px rgba(0,0,0,0.2);

        }

        /* Icon badge — colored per game via the --accent custom property */
        .game-icon{

            width:76px;
            height:76px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:42px;

            border-radius:50%;

            background:linear-gradient(135deg, var(--accent), var(--accent-dark));

            box-shadow:0 10px 22px rgba(0,0,0,0.2);

        }

        .game-title{

            font-size:34px;
            letter-spacing:2px;

            color:#2c2c2c;

        }

        .game-desc{

            font-size:20px;

            color:#666;

            min-height:38px;

        }

        /* Call-to-action pill at the bottom of each card */
        .game-cta{

            margin-top:auto;

            padding:10px 28px;

            font-size:22px;
            font-weight:bold;
            letter-spacing:1px;

            color:white;

            border-radius:999px;

            background:linear-gradient(135deg, var(--accent), var(--accent-dark));

            box-shadow:0 8px 18px rgba(0,0,0,0.2);

            transition:0.3s;

        }

        .game-card:hover .game-cta{

            transform:translateY(-2px);

            box-shadow:0 12px 24px rgba(0,0,0,0.3);

        }

        .game-cta .arrow{

            display:inline-block;

            transition:transform 0.3s;

        }

        .game-card:hover .game-cta .arrow{

            transform:translateX(4px);

        }

        /* Per-game accent colors */
        .game-card.flags{
            --accent:#4CAF50;
            --accent-dark:#3f9142;
        }

        .game-card.globe{
            --accent:#2196F3;
            --accent-dark:#1769aa;
        }

        .game-card.capital{
            --accent:#7c4dff;
            --accent-dark:#5e35b1;
        }

        /* A quietly-styled placeholder card, hinting more games are coming
           without pretending to be a real, clickable game */
        .game-card.coming-soon{

            border:2px dashed #b8c9c6;

            background:rgba(255,255,255,0.4);

            box-shadow:none;

            cursor:default;

        }

        .game-card.coming-soon:hover{

            transform:none;

            border-color:#b8c9c6;

            box-shadow:none;

        }

        .game-card.coming-soon .game-icon{

            background:none;

            border:2px dashed #b8c9c6;

            color:#9fb3af;

            box-shadow:none;

        }

        .game-card.coming-soon .game-title,
        .game-card.coming-soon .game-desc{

            color:#9fb3af;

        }

        /* Daily Quiz entry point — fixed top-right, deliberately separate from
           the games grid since it's a once-a-day pick, not another game mode */
        .daily-quiz-badge{

            position:fixed;
            top:28px;
            right:28px;
            z-index:10;

            display:flex;
            align-items:center;
            gap:8px;

            padding:12px 22px;

            text-decoration:none;

            font-size:16px;
            font-weight:800;
            letter-spacing:1px;

            color:white;

            border-radius:999px;

            background:linear-gradient(135deg, #e67e22, #cf6c15);

            box-shadow:0 8px 20px rgba(230,126,34,0.35);

            animation:dailyBadgeGlow 3s ease-in-out infinite;

            transition:transform 0.3s, box-shadow 0.3s;

        }

        @keyframes dailyBadgeGlow{
            0%, 100% { box-shadow:0 8px 20px rgba(230,126,34,0.35); }
            50%      { box-shadow:0 8px 28px rgba(230,126,34,0.6); }
        }

        .daily-quiz-badge:hover{
            transform:translateY(-2px);
            box-shadow:0 12px 26px rgba(230,126,34,0.5);
        }

        /* Small credits link under the games grid */
        .site-footer{
            margin-top:24px;
            font-size:14px;
        }

        .site-footer a{
            color:#5a8b83;
            text-decoration:none;
            font-weight:700;
        }

        .site-footer a:hover{
            text-decoration:underline;
        }
    </style>
    <link rel="stylesheet" href="/css/mobile.css?v=3">
</head>

<body>

<!-- Decorative background glow elements -->
<div class="glow-circle glow2"></div>
<div class="glow-circle glow3"></div>

<!-- Daily Quiz entry point — the once-a-day pick lives outside the regular
     games grid, so it stays visible and reachable from every visit -->
<a class="daily-quiz-badge" href="/DailyQuiz/start">
    <span>📅</span>
    <span>DAILY QUIZ</span>
</a>

<!-- Hub header -->
<div class="hub-header">
    <h1>MUNDOFLAG</h1>
    <p class="hub-subtitle">Pick a game to play</p>
</div>

<!-- Game selection grid — each card links straight to that game's own lobby,
     where its specific modes/options are chosen -->
<div class="games-grid">

    <a class="game-card flags" href="/Flags">
        <div class="game-icon">🏳️</div>
        <h2 class="game-title">FLAGS</h2>
        <p class="game-desc">Guess the country by its flag</p>
        <span class="game-cta">PLAY <span class="arrow">→</span></span>
    </a>

    <a class="game-card globe" href="/Globe">
        <div class="game-icon">🌍</div>
        <h2 class="game-title">GLOBE</h2>
        <p class="game-desc">Guess the country on the map</p>
        <span class="game-cta">PLAY <span class="arrow">→</span></span>
    </a>

    <a class="game-card capital" href="/Capital">
        <div class="game-icon">🏛️</div>
        <h2 class="game-title">CAPITAL</h2>
        <p class="game-desc">Guess capital cities and their countries</p>
        <span class="game-cta">PLAY <span class="arrow">→</span></span>
    </a>

    <div class="game-card coming-soon">
        <div class="game-icon">✨</div>
        <h2 class="game-title">More soon</h2>
        <p class="game-desc">New games and modes are on the way</p>
    </div>

</div>

<footer class="site-footer">
    <a href="/credits">Credits</a>
</footer>

<script src="/js/bg-music.js?v=2"></script>
<script src="/js/preload-globe.js?v=3"></script>
</body>
</html>
